replicaCount: 2  # Nombre de réplicas
image:
  repository: yassine315/chatgpt-spring-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer  # Type du service (peut être NodePort)
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

h2console:
  enabled: true
  path: /h2-console

env:
  SPRING_DATASOURCE_URL: "jdbc:h2:mem:chatgpt;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
  SPRING_DATASOURCE_USERNAME: "sa"
  SPRING_DATASOURCE_PASSWORD: ""
